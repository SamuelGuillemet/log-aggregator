name: Publish local runner

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:local
      - uses: actions/upload-artifact@v4
        with:
          name: log-aggregator-local
          path: |
            release/log-aggregator-local.tar.gz
            release/log-aggregator-local.zip
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/log-aggregator-local.tar.gz release/log-aggregator-local.zip --generate-notes
